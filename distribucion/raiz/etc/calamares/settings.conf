# El instalador de la Nueva Somosaguas: el orden de Debian (calamares-settings-debian),
# con dos pasos más. removeuser quita la cuenta alumno de la sesión en vivo antes de
# crear la de quien instala, que hereda así el uid 1000. shellprocess@somosaguas quita
# lo que solo tiene sentido en vivo. Sin sources-final: las fuentes de apt de la imagen
# (con non-free-firmware y las de seguridad) ya son las buenas.
---
modules-search: [ local, /usr/lib/calamares/modules ]
instances:
  - id: somosaguas
    module: shellprocess
    config: shellprocess_somosaguas.conf
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - luksbootkeyfile
      - dpkg-unsafe-io
      - sources-media
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - removeuser
      - users
      - shellprocess@somosaguas
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader-config
      - grubcfg
      - bootloader
      - packages
      - plymouthcfg
      - initramfscfg
      - initramfs
      - dpkg-unsafe-io-undo
      - sources-media-unmount
      - umount
  - show:
      - finished
branding: somosaguas
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
