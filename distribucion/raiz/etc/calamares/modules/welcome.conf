# Como Debian, con más disco: el entorno instalado ocupa unos 15 GB antes de empezar a
# trabajar.
---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true
requirements:
    requiredStorage:    40
    requiredRam:        4.0
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root
