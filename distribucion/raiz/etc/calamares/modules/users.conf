# Como Debian, más el grupo docker (Docker, para los devcontainers de las asignaturas).
# Propone «alumno» como nombre de la cuenta, que se puede cambiar; la cuenta nace de la
# plantilla (/etc/skel) con todo el entorno.
---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
    - docker
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false
passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0
user:
    shell: /bin/bash
presets:
    loginName:
        value: "alumno"
        editable: true
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "nueva-somosaguas"
