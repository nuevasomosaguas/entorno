# Disco: btrfs, con instantáneas diarias de Snapper (somosaguas-instantaneas), sin swap
# en disco por omisión (la da zram en la RAM), o con la suficiente para hibernar si se
# elige. ext4 sigue en la lista, sin instantáneas. El cifrado se ofrece al borrar el
# disco; Calamares 3.3 no permite dejarlo marcado de antemano (en los portátiles de la
# facultad lo impone el preseed). LUKS1: GRUB tiene que abrir /boot, y no admite LUKS2
# con Argon2.
---
efiSystemPartition: "/boot/efi"
userSwapChoices:
    - none
    - small
    - suspend
    - file
initialSwapChoice: none
luksGeneration: luks1
enableLuksAutomatedPartitioning: true
defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["btrfs", "ext4"]
