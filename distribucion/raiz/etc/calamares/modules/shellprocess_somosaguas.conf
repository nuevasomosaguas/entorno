# En el sistema instalado, fuera lo que solo tiene sentido en vivo: el sudo sin
# contraseña de la cuenta alumno y su entrada automática en el escritorio (si quien
# instala la quiere, la marca en Calamares y la escribe displaymanager). Y, en btrfs,
# las instantáneas de Snapper.
---
dontChroot: false
timeout: 60
script:
    - "rm -f /etc/sudoers.d/alumno"
    - "sed -i '/^autologin-/d' /etc/lightdm/lightdm.conf.d/50-somosaguas.conf"
    - "/usr/local/sbin/somosaguas-instantaneas"
