# Fuera lo que solo sirve en vivo, y también el propio instalador. Solo paquetes que la
# imagen lleva: la lista de Debian trae live-config, live-tools y demás, que aquí no
# están, y apt, sin ellos en sus listas, para con el error 100 y Calamares no hace los
# pasos que siguen (initramfs, deshacer el dpkg sin fsync, quitar el repositorio de la ISO).
# live-boot-initramfs-tools es la dependencia de live-boot.
---
backend: apt
operations:
  - remove:
      - 'live-boot'
      - 'live-boot-initramfs-tools'
      - 'calamares-settings-debian'
      - 'calamares'
