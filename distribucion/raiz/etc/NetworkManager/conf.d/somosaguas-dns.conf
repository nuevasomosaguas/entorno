# DNS de la Nueva Somosaguas: Cloudflare (1.1.1.1, 1.0.0.1) y, si no responde, Google
# (8.8.8.8, 8.8.4.4), en ese orden, en cualquier red, en lugar de los que dé cada red:
# más rápidos y más privados que los de muchos routers y operadoras. Si una red exige
# los suyos (el portal de acceso de un hotel, nombres internos de la facultad), se
# borra este archivo y se reinicia NetworkManager.
[global-dns-domain-*]
servers=1.1.1.1,1.0.0.1,8.8.8.8,8.8.4.4
