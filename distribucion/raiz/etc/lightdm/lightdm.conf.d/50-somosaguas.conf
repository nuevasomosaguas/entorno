# La sesión en vivo entra sola en XFCE con el usuario alumno.
#
# La lista de usuarios, a la vista: Debian la esconde (greeter-hide-users=true, en
# /usr/share/lightdm/lightdm.conf.d/01_debian.conf) y la pantalla de inicio y de desbloqueo
# pide entonces el nombre a mano, un modo en el que una contraseña equivocada solo deja la
# palabra «Password» en un aviso neutro. Con la lista, dice «La contraseña es incorrecta».
[Seat:*]
autologin-user=alumno
autologin-session=xfce
user-session=xfce
greeter-hide-users=false
