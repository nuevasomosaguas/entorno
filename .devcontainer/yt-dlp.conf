# yt-dlp en la Nueva Somosaguas: pensado para cursos y conferencias. Cualquier opción
# se cambia en la propia orden o en ~/.config/yt-dlp/config.

# Hasta 1080p con el mejor audio; si no hay pistas separadas, el mejor archivo único.
-f "bv*[height<=1080]+ba/b"
# Siempre en MKV: al juntar vídeo y audio y también cuando YouTube da un solo WebM
# (se cambia el contenedor, sin volver a codificar).
--merge-output-format mkv
--remux-video mkv

# Subtítulos en inglés junto al vídeo, en .srt (mpv los carga solo): los hechos a
# mano si existen y, si no, los automáticos.
--write-subs
--write-auto-subs
--sub-langs "en"
--convert-subs srt

# Cada lista en su carpeta de ~/Cursos, con las clases numeradas; un vídeo suelto,
# en «Vídeos sueltos».
-o "~/Cursos/%(playlist_title|Vídeos sueltos)s/%(playlist_index&{:02d} - |)s%(title)s.%(ext)s"

# Volver a lanzar la misma lista solo baja las clases nuevas; los capítulos del vídeo
# quedan dentro del archivo, para saltar entre ellos en mpv.
--download-archive "~/Cursos/.descargados"
--embed-chapters
