<!doctype html>
<html lang="{{ site.Language.Locale | default "es" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Summary }}{{ . | plainify | truncate 160 }}{{ else }}{{ site.Params.descripcion }}{{ end }}{{ end }}">
  <link rel="icon" href="{{ "marca.svg" | relURL }}" type="image/svg+xml">
  {{ with resources.Get "somosaguas.css" | minify | fingerprint }}<link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">{{ end }}
  {{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" href="{{ .RelPermalink }}" title="{{ site.Title }}">{{ end }}
</head>
<body>
  <header class="cabecera">
    <a class="marca" href="{{ "/" | relURL }}" aria-label="{{ site.Title }}, inicio"><img src="{{ "marca.svg" | relURL }}" alt="" width="36" height="36"></a>
    <nav aria-label="Principal">
      {{ $actual := . }}
      {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if or ($actual.IsMenuCurrent "main" .) ($actual.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="pie">Copyleft {{ site.Lastmod.Year }}, {{ site.Params.autor }}</footer>
</body>
</html>
