# mpv en la Nueva Somosaguas: cada vídeo vuelve donde se dejó, también tras un cierre
# inesperado (guardar-posicion.lua guarda cada 30 s), y h abre el historial (memo.lua).
# Una lista, también en streaming («mpv URL-de-la-lista»), vuelve a su clase
# (retomar-listas.lua); n copia el momento para las notas (copiar-momento.lua).
save-position-on-quit=yes
# s: el fotograma, con los subtítulos, a ~/Screenshots, con el título y el minuto en el
# nombre: la diapositiva de una clase, lista para pegarla en Obsidian.
screenshot-dir=~/Screenshots
screenshot-template="%{media-title} %wH.%wM.%wS"
# Una carpeta de ~/Cursos se abre como la lista de sus vídeos, sin su ficha curso.m3u, que
# repetiría detrás de las clases bajadas el curso entero en streaming.
directory-filter-types=video,audio
# Subtítulos en inglés, como al bajar con yt-dlp: el ytdl_hook de mpv pide todos si no le
# dicen cuáles, y con el --write-auto-subs de /etc/yt-dlp.conf eso son las ~150 traducciones
# automáticas de YouTube. Se eligen por idioma (slang), no por número de pista: el número
# guardado al salir (sid) apuntaba a otra pista, o a ninguna, al volver a abrir el vídeo.
# Si se ocultan con v, quedan ocultos en ese vídeo (sub-visibility sí se guarda).
ytdl-raw-options-append=sub-langs=en
# El enlace de un vídeo dentro de una lista (watch?v=…&list=…, el que da YouTube al pulsar
# una clase) abre la lista entera desde esa clase, no la clase suelta: el ytdl_hook de mpv
# pasa --no-playlist si no le dicen yes-playlist, y sin lista no había ficha en ~/Cursos.
ytdl-raw-options-append=yes-playlist=
slang=en
watch-later-options-remove=sid
