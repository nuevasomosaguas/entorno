<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Las tres familias del estándar gráfico: Inter, EB Garamond y Fira Code. -->
  <alias binding="strong"><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>EB Garamond</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Fira Code</family><family>JuliaMono</family></prefer></alias>
  <!-- Lo que Fira Code no tiene (⋅, ⊗, ′, ᵀ, 𝒳, las letras matemáticas en negrita…) sale de
       JuliaMono, monoespaciada y hecha para Julia, también donde se pide «Fira Code» por su
       nombre (la terminal, Mousepad, Zathura). Lo demás, de Noto: ni cuadraditos ni tofu. -->
  <alias><family>Fira Code</family><default><family>JuliaMono</family></default></alias>

  <!-- Suavizado en escala de grises con hinting ligero, como macOS y GNOME: el
       escritorio llega por VNC y se escala en el navegador, así que el suavizado
       subpíxel (RGB) solo añadiría bordes de color. Sin mapas de bits incrustados. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
