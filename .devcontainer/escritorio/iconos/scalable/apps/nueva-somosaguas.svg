  <line x1="27.89" y1="27.05" x2="25.85" y2="30.79" stroke="#7c1408" stroke-width="3.2"/><polygon points="23.12,35.80 22.75,28.54 29.43,32.17" fill="#7c1408"/>
  <line x1="36.11" y1="27.05" x2="38.15" y2="30.79" stroke="#7c1408" stroke-width="3.2"/><polygon points="40.88,35.80 34.57,32.17 41.25,28.54" fill="#7c1408"/>
  <g fill="none" stroke="#342521" stroke-width="2.8">
    <circle cx="32" cy="19.5" r="7.2"/><circle cx="19.2" cy="43" r="7.2"/><circle cx="44.8" cy="43" r="7.2"/>
  </g>
</svg>
