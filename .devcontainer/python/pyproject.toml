# El entorno de Python de la imagen (/opt/venv): solo fontanería e ingesta de datos.
# Las versiones exactas están en uv.lock; para subirlas, se cambia exclude-newer
# y se ejecuta `uv lock`.
[project]
name = "entorno"
version = "2026.2"
requires-python = "==3.13.*"
dependencies = [
  "ipykernel",
  "pandas",
  "polars",
  "pyarrow",
  "duckdb",
  "psycopg[binary]",
  "ruff",
  "yt-dlp[default]",
  # El motor de JavaScript con el que yt-dlp resuelve los retos de YouTube (el que usa
  # sin configurar nada): el Node de Debian es anterior al 22 y no le sirve. Sin él,
  # YouTube niega los vídeos (403, «Sign in to confirm you're not a bot») a mpv y a yt-dlp.
  "deno",
]

[tool.uv]
package = false
exclude-newer = "2026-09-01"
