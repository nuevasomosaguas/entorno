name: Publicar la imagen

# Una versión por semestre: 2026.2 (septiembre), 2027.1 (febrero); 2026.2.1 para
# un arreglo entre medias. Las etiquetas publicadas no se borran nunca.
# A mano (Actions → Run workflow), solo construye y comprueba, sin publicar.
on:
  push:
    tags: ["20[0-9][0-9].[12]", "20[0-9][0-9].[12].*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      # La imagen pesa varios gigas: se libera el espacio que el runner trae ocupado.
      - name: Liberar disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost

      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El Dockerfile comprueba cada herramienta al final de cada etapa: si algo
      # falta, la construcción falla y no se publica nada.
      - name: Imagen base (devcontainer local)
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          target: base
          push: ${{ github.ref_type == 'tag' }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-cache:escritorio
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # Reutiliza las capas de la base del paso anterior y guarda en la caché todas las
      # etapas (julia incluida) para la versión siguiente: un arreglo que solo toca R o
      # Python no vuelve a precompilar Julia. La caché va en el registro (entorno-cache),
      # no en la de Actions: esa guarda 10 GB por repositorio, menos que estas imágenes, y
      # al perder capas las rehacía con otro digest, que los equipos volvían a bajar.
      - name: Imagen escritorio (Codespaces)
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          target: escritorio
          push: ${{ github.ref_type == 'tag' }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-cache:escritorio
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-cache:escritorio,mode=max,image-manifest=true,oci-mediatypes=true
          tags: ghcr.io/${{ github.repository }}-escritorio:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # La del sistema (la de la ISO), sobre el escritorio recién publicado: la que baja
      # somosaguas-actualizar en los equipos instalados, para que cada versión, también
      # 2026.2.1, les llegue sin reinstalar. Solo con etiqueta: parte de esa imagen.
      - name: Imagen del sistema (distribución)
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v6
        with:
          context: distribucion
          target: sistema
          build-contexts: repo=.
          # Con caché también: un arreglo en raiz/ rehace solo sus últimas capas, y
          # somosaguas-actualizar, que guarda la imagen anterior, baja unos cien megas.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-cache:sistema
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-cache:sistema,mode=max,image-manifest=true,oci-mediatypes=true
          build-args: |
            IMAGEN=ghcr.io/${{ github.repository }}-escritorio:${{ github.ref_name }}
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          push: true
          tags: ghcr.io/${{ github.repository }}-sistema:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
